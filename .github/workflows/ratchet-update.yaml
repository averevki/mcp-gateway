name: Ratchet Update

on:
  schedule:
    - cron: '42 3 17 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-actions:
    runs-on: ubuntu-latest
    name: Update pinned actions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4
        with:
          token: ${{ secrets.KUADRANT_DEV_PAT }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # ratchet:actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make ratchet-update-all
      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # ratchet:peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update pinned GitHub Actions to latest SHAs"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          token: ${{ secrets.KUADRANT_DEV_PAT }}
          signoff: true
          base: main
          branch: chore/ratchet-update
          delete-branch: true
          title: "chore: update pinned GitHub Actions to latest SHAs"
          body: |
            Automated monthly update of pinned GitHub Actions references.

            Auto-generated by [ratchet-update](https://github.com/kuadrant/mcp-gateway/actions/workflows/ratchet-update.yaml)
          labels: dependencies
